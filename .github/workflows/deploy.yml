name: Deploy to Cloudflare

# Runs on every save from /admin (each save is a commit) and on code changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A burst of saves produces one deployment: newer runs cancel older ones.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://ditto-hub.pages.dev' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Reuse resized photos from earlier builds
        uses: actions/cache@v4
        with:
          path: |
            public/_gen
            node_modules/.astro
          key: images-${{ hashFiles('public/products/**', 'public/insta/**', 'public/reviews/**') }}
          restore-keys: images-

      - run: npm run build
            - name: Verify Astro homepage output
        run: |
          echo "Checking generated website files..."
          if [ ! -d dist ]; then
            echo "::error::The dist folder was not created."
            exit 1
          fi
          echo "HTML files generated:"
          find dist -type f -name '*.html' | sort | head -80
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html is missing."
            exit 1
          fi
          echo "SUCCESS: Homepage dist/index.html exists."
      # First run only: creates the "ditto-hub" Pages project if it does not exist yet.
      - name: Make sure the Cloudflare Pages project exists
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects"
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CF_API_TOKEN" "$api/ditto-hub")
          if [ "$status" = "404" ]; then
            curl -sSf -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
              "$api" --data '{"name":"ditto-hub","production_branch":"main"}' > /dev/null
            echo "Created the Cloudflare Pages project ditto-hub."
          else
            echo "Pages project check returned HTTP $status."
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ditto-hub --branch=main
